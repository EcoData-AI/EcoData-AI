[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-backend"
version = "0.1.0"
description = "GAIA — General-purpose Adaptive Intelligence Assistant (backend core)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "keyring>=25.0",
    # Official SDK for the Anthropic provider. Other providers speak plain HTTP
    # over httpx because they are generic OpenAI-compatible / Ollama endpoints
    # with no official SDK of their own.
    "anthropic>=0.116",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "anyio>=4.4",
    "ruff>=0.5",
]

[project.scripts]
gaia-backend = "gaia.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gaia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
